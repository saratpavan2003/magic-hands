<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magic Hands</title>
<meta name="description" content="Wave your hands in front of the camera to draw sparkles in the air, throw fireballs and pop bubbles. The camera picture stays on your device.">
<meta name="theme-color" content="#2b1d5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Magic Hands">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪄</text></svg>">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="wrap">
  <div class="head">
    <h1>🪄 Magic Hands</h1>
    <p>Do magic with your hands. No touching!</p>
  </div>

  <section>
    <div class="card mg-start">
      <button class="btn mg-go" id="mg-start" type="button">📷 Start the magic!</button>
      <button class="btn alt" id="mg-touch" type="button">👆 Use my finger instead</button>
      <p class="mg-safe" id="mg-safe"></p>
    </div>
  </section>

  <section>
    <a class="card sl-link" href="./snakes.html">
      <span class="e">🐍🪜</span>
      <span><b>New: Snakes &amp; Ladders pop-up book!</b><br>A bookcase appears in your room. Open the book and play with up to 4 players.</span>
    </a>
  </section>

  <section>
    <h2 class="sec-title">🎩 Four Kinds of Magic</h2>
    <div class="cards" id="mg-cards"></div>
  </section>

  <section>
    <h2 class="sec-title">💡 Magic Tips</h2>
    <div class="card mg-tips"><ul id="mg-tips"></ul></div>
  </section>

  <footer>Hand tracking by Google's open-source MediaPipe, running on your device.</footer>
</main>

<div class="mg-stage" id="mg-stage" role="dialog" aria-modal="true" aria-label="Magic Hands" hidden>
  <video id="mg-video" playsinline muted autoplay></video>
  <canvas id="mg-canvas" aria-hidden="true"></canvas>
  <div class="mg-top">
    <button class="mg-round" id="mg-close" type="button" aria-label="Close the magic">✕</button>
    <button class="mg-round" id="mg-fit" type="button" aria-label="Show the whole camera picture" hidden>⤢</button>
    <button class="mg-round" id="mg-sound" type="button" aria-label="Sound" aria-pressed="true">🔊</button>
    <button class="mg-round" id="mg-flip" type="button" aria-label="Switch camera" hidden>🔄</button>
  </div>
  <div class="mg-pills">
    <span class="mg-pill" id="mg-score" aria-live="polite" hidden>🫧 0</span>
    <span class="mg-pill" id="mg-ammo" aria-label="Arrows left" hidden>🏹 10</span>
  </div>
  <p class="mg-hint" id="mg-hint" aria-live="polite"></p>
  <div class="mg-modes" id="mg-modes" role="group" aria-label="Kind of magic"></div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
